[package]
name = "ucsc_menu"
version = "0.1.0"
edition = "2021"
# opt-level = 3

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.11.27", default-features = false, features = [
    "rustls-tls",
    "gzip",
] }
scraper = "0.19.0"
bitflags = "2.5.0"
rusty-money = { version = "0.4.1", features = ["iso"] }
chrono = { version = "0.4.37", features = [
    "serde",
    "std",
], default-features = false }
url = "2.5.0"
futures = "0.3.30"
serde_json = "1.0.116"
regex = "1.10.4"
serde = "1.0.199"
tracing = "0.1.40"
governor = { version = "0.6.3", features = [
    "jitter",
    "quanta",
    "std",
], default-features = false }
futures-locks = "0.7.1"
tower-http = { version = "0.5.2", features = ["compression-full", "cors"] }
pretty_env_logger = "0.5.0"
log = { version = "0.4.21" }
async-compression = { version = "0.4.9", features = ["gzip"] }
axum-server = { version = "0.7.3", features = ["tls-rustls"] }
axum = { version = "0.8.7", default-features = false, features = [
    "http1",
    "http2",
] }
juniper = { version = "0.17.0", features = ["schema-language", "chrono"] }
tokio = { version = "1.48.0", features = [
    "macros",
    "net",
    "parking_lot",
    "rt",
    "signal",
    "sync",
], default-features = false }
juniper_axum = { version = "0.3.0", features = ["subscriptions"] }
juniper_graphql_ws = { version = "0.5.0", features = ["graphql-ws"] }
firestore = "0.47.0"

[dev-dependencies]
tracing = "0.1.40"
tokio-scoped = "0.2.0"

[target.'cfg(all(target_env = "musl", target_pointer_width = "64"))'.dependencies.mimalloc]
version = "0.1"
default-features = false
